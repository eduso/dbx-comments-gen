# Databricks Asset Bundle (DAB) — dbx-comments-gen
#
# Este bundle despliega el generador automático de comentarios para esquemas,
# tablas y columnas de Unity Catalog usando IA.
#
# Uso:
#   databricks bundle validate --profile <profile>
#   databricks bundle deploy --target dev --profile <profile>
#   databricks bundle run comments_generator --target dev --profile <profile>
#
# Para más información: https://docs.databricks.com/dev-tools/bundles/

bundle:
  name: dbx-comments-gen

# ─────────────────────────────────────────────────────────────────────────────
# Variables parametrizables
# Se pueden sobreescribir por target o al momento de ejecutar el bundle.
# ─────────────────────────────────────────────────────────────────────────────
variables:
  catalog_name:
    description: "Catálogo de Unity Catalog a procesar"
    default: "main_eduardo_sojo"
  schema_name:
    description: "Esquema específico (vacío = todo el catálogo)"
    default: ""
  model_endpoint:
    description: "Endpoint del modelo fundacional en Foundation Model API"
    default: "databricks-claude-sonnet-4-5"
  results_catalog:
    description: "Catálogo donde se persisten los resultados"
    default: "main_eduardo_sojo"
  results_schema:
    description: "Esquema donde se persisten los resultados"
    default: "ai_comments_generation"
  enable_sampling:
    description: "Habilitar muestreo de datos reales (yes/no)"
    default: "no"
  sampling_pct:
    description: "Porcentaje de muestreo para tablas con más de 500 registros (1-100)"
    default: "10"

# ─────────────────────────────────────────────────────────────────────────────
# Workspace — archivos sincronizados al workspace de Databricks
# ─────────────────────────────────────────────────────────────────────────────
workspace:
  root_path: /Users/${workspace.current_user.userName}/dbx-comments-gen

# ─────────────────────────────────────────────────────────────────────────────
# Sync — incluir la carpeta input/ con los insumos del usuario
# ─────────────────────────────────────────────────────────────────────────────
sync:
  include:
    - "src/**"
    - "input/**"

# ─────────────────────────────────────────────────────────────────────────────
# Recursos — Jobs definidos en el bundle
# ─────────────────────────────────────────────────────────────────────────────
resources:
  jobs:
    comments_generator:
      name: "[${bundle.target}] Generador de Comentarios con IA"
      description: >
        Genera comentarios descriptivos para esquemas, tablas y columnas
        de Unity Catalog usando un modelo fundacional de IA.
        Los resultados se persisten en las tablas de control configuradas.

      # Parámetros del job expuestos en la UI de Databricks
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: model_endpoint
          default: ${var.model_endpoint}
        - name: results_catalog
          default: ${var.results_catalog}
        - name: results_schema
          default: ${var.results_schema}
        - name: enable_sampling
          default: ${var.enable_sampling}
        - name: sampling_pct
          default: ${var.sampling_pct}

      tasks:
        - task_key: generate_comments
          description: "Ejecuta el notebook de generación de comentarios con los parámetros configurados"
          notebook_task:
            notebook_path: src/notebooks/comments_generator_v4.py
            base_parameters:
              catalog_name:    "{{job.parameters.catalog_name}}"
              schema_name:     "{{job.parameters.schema_name}}"
              model_endpoint:  "{{job.parameters.model_endpoint}}"
              results_catalog: "{{job.parameters.results_catalog}}"
              results_schema:  "{{job.parameters.results_schema}}"
              enable_sampling: "{{job.parameters.enable_sampling}}"
              sampling_pct:    "{{job.parameters.sampling_pct}}"
            source: WORKSPACE
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            num_workers: 0
            node_type_id: "Standard_DS3_v2"
            spark_conf:
              spark.master: "local[*, 4]"
              spark.databricks.cluster.profile: "singleNode"
            custom_tags:
              ResourceClass: "SingleNode"
              project: "dbx-comments-gen"

      tags:
        project: "dbx-comments-gen"
        team: "field-engineering"

# ─────────────────────────────────────────────────────────────────────────────
# Targets — Configuración por ambiente
# ─────────────────────────────────────────────────────────────────────────────
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-361426925668745.5.azuredatabricks.net

  prod:
    mode: production
    workspace:
      host: https://adb-361426925668745.5.azuredatabricks.net
    variables:
      catalog_name: "main"
      results_catalog: "main"
