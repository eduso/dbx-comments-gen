# Databricks Asset Bundle (DAB) — dbx-comments-gen v7
#
# Jobs:
#   comments_pipeline       : setup_schema → generate_comments → apply_comments
#   comments_audit_pipeline : audit_comments (veredicto sobre `resultados`)
#   comments_eval_pipeline  : eval_models (bake-off offline de modelos)
#
# Uso:
#   databricks bundle validate --target dev --profile <profile>
#   databricks bundle deploy   --target dev --profile <profile>
#   databricks bundle run comments_pipeline --target dev --profile <profile>
#
# Docs: https://docs.databricks.com/dev-tools/bundles/

bundle:
  name: dbx-comments-gen

# ─────────────────────────────────────────────────────────────────────────────
# Variables (solo model_endpoint tiene default; el resto debe especificarse
# por target o al ejecutar)
# ─────────────────────────────────────────────────────────────────────────────
variables:
  scope_table:
    description: "Tabla de control con los objetos a documentar (catalogo.esquema.tabla)"
    default: ""
  scope_catalog_column:
    description: "Columna de scope_table que contiene el nombre del catálogo"
    default: ""
  scope_schema_column:
    description: "Columna de scope_table que contiene el nombre del esquema"
    default: ""
  scope_table_column:
    description: "Columna de scope_table que contiene el nombre de la tabla"
    default: ""
  model_endpoint:
    description: "Endpoint del modelo fundacional"
    default: "databricks-claude-sonnet-4-5"
  results_catalog:
    description: "Catálogo donde se persisten los resultados"
    default: ""
  results_schema:
    description: "Esquema donde se persisten los resultados"
    default: ""
  enable_sampling:
    description: "Habilitar muestreo de datos reales (yes/no)"
    default: "no"
  sampling_pct:
    description: "Porcentaje de muestreo para tablas > 500 registros (1-100)"
    default: ""
  warehouse_id:
    description: "SQL Warehouse ID para el dashboard"
    default: ""
  audit_model_endpoint:
    description: "Endpoint del modelo fundacional usado por la auditoría"
    default: "databricks-claude-sonnet-4-5"
  audit_only_approved:
    description: "Auditar solo filas con status='aprobado' (yes/no)"
    default: "yes"
  candidate_models:
    description: "Modelos candidatos a comparar en el bake-off (separados por coma)"
    default: ""
  judge_model:
    description: "Modelo juez del bake-off (neutral, no debe ser candidato)"
    default: "databricks-claude-opus-4-1"
  golden_table:
    description: "Tabla del golden set (vacío = <results>.golden_set_comentarios)"
    default: ""
  experiment_path:
    description: "Ruta del experimento MLflow para el bake-off"
    default: "/Shared/eval-comentarios-fundacionales"
  eval_gen_temperature:
    description: "Temperatura de generación durante el bake-off"
    default: "0.0"
  eval_n_consistency_runs:
    description: "Corridas por input para medir consistencia"
    default: "3"
  eval_max_comment_chars:
    description: "Máximo de caracteres por comentario en el bake-off"
    default: "500"

# ─────────────────────────────────────────────────────────────────────────────
# Workspace
# ─────────────────────────────────────────────────────────────────────────────
workspace:
  root_path: /Users/${workspace.current_user.userName}/dbx-comments-gen

sync:
  include:
    - "src/**"
    - "input/**"

# ─────────────────────────────────────────────────────────────────────────────
# Recursos
# ─────────────────────────────────────────────────────────────────────────────
resources:
  dashboards:
    comments_dashboard:
      display_name: "[${bundle.target}] Generación de Comentarios con IA"
      file_path: src/dashboard.lvdash.json
      warehouse_id: ${var.warehouse_id}
      embed_credentials: false

  jobs:
    comments_pipeline:
      name: "[${bundle.target}] Generador de Comentarios con IA"
      description: >
        Pipeline: setup_schema → generate_comments → apply_comments.
        Aplica al catálogo los comentarios con status='aprobado'.

      parameters:
        - name: scope_table
          default: ${var.scope_table}
        - name: scope_catalog_column
          default: ${var.scope_catalog_column}
        - name: scope_schema_column
          default: ${var.scope_schema_column}
        - name: scope_table_column
          default: ${var.scope_table_column}
        - name: model_endpoint
          default: ${var.model_endpoint}
        - name: results_catalog
          default: ${var.results_catalog}
        - name: results_schema
          default: ${var.results_schema}
        - name: enable_sampling
          default: ${var.enable_sampling}
        - name: sampling_pct
          default: ${var.sampling_pct}

      tasks:
        - task_key: setup_schema
          description: "Crea esquema y tablas de control"
          notebook_task:
            notebook_path: src/01_setup_schema.py
            base_parameters:
              results_catalog: "{{job.parameters.results_catalog}}"
              results_schema:  "{{job.parameters.results_schema}}"
            source: WORKSPACE
          new_cluster: &single_node_cluster
            spark_version: "15.4.x-scala2.12"
            num_workers: 0
            node_type_id: "Standard_DS3_v2"
            spark_conf:
              spark.master: "local[*, 4]"
              spark.databricks.cluster.profile: "singleNode"
            custom_tags:
              ResourceClass: "SingleNode"
              project: "dbx-comments-gen"

        - task_key: generate_comments
          depends_on:
            - task_key: setup_schema
          description: "Genera comentarios con IA y los persiste"
          notebook_task:
            notebook_path: src/02_generate_comments.py
            base_parameters:
              scope_table:          "{{job.parameters.scope_table}}"
              scope_catalog_column: "{{job.parameters.scope_catalog_column}}"
              scope_schema_column:  "{{job.parameters.scope_schema_column}}"
              scope_table_column:   "{{job.parameters.scope_table_column}}"
              model_endpoint:       "{{job.parameters.model_endpoint}}"
              results_catalog:      "{{job.parameters.results_catalog}}"
              results_schema:       "{{job.parameters.results_schema}}"
              enable_sampling:      "{{job.parameters.enable_sampling}}"
              sampling_pct:         "{{job.parameters.sampling_pct}}"
            source: WORKSPACE
          new_cluster: *single_node_cluster

        - task_key: apply_comments
          depends_on:
            - task_key: generate_comments
          description: "Aplica al catálogo los comentarios con status=aprobado"
          notebook_task:
            notebook_path: src/03_apply_comments.py
            base_parameters:
              results_catalog: "{{job.parameters.results_catalog}}"
              results_schema:  "{{job.parameters.results_schema}}"
              id_ejecucion:    ""
            source: WORKSPACE
          new_cluster: *single_node_cluster

      tags:
        project: "dbx-comments-gen"
        team: "field-engineering"

    comments_audit_pipeline:
      name: "[${bundle.target}] Auditoría de Comentarios con IA"
      description: >
        Audita los comentarios persistidos en la tabla `resultados` contra
        los insumos de `mapping.md` + `audit_mapping.md` y los criterios
        declarados en `src/audit_criteria.py`. Solo escribe veredicto en
        `criterio_fallido` / `detalles_criterio_fallido`; no toca `status`.

      parameters:
        - name: results_catalog
          default: ${var.results_catalog}
        - name: results_schema
          default: ${var.results_schema}
        - name: id_ejecucion
          default: ""
        - name: audit_only_approved
          default: ${var.audit_only_approved}
        - name: audit_model_endpoint
          default: ${var.audit_model_endpoint}

      tasks:
        - task_key: audit_comments
          description: "Audita los comentarios contra los insumos provistos"
          notebook_task:
            notebook_path: src/04_audit_comments.py
            base_parameters:
              results_catalog:      "{{job.parameters.results_catalog}}"
              results_schema:       "{{job.parameters.results_schema}}"
              id_ejecucion:         "{{job.parameters.id_ejecucion}}"
              audit_only_approved:  "{{job.parameters.audit_only_approved}}"
              audit_model_endpoint: "{{job.parameters.audit_model_endpoint}}"
            source: WORKSPACE
          new_cluster: *single_node_cluster

      tags:
        project: "dbx-comments-gen"
        team: "field-engineering"

    comments_eval_pipeline:
      name: "[${bundle.target}] Bake-off de Modelos Fundacionales"
      description: >
        Compara modelos fundacionales candidatos sobre la tarea del generador
        de comentarios usando un golden set fijo, scorers determinísticos y un
        juez LLM neutral (criterios de `src/audit_criteria.py`). Registra cada
        candidato como un run de MLflow y produce un scorecard ponderado.
        Proceso de selección offline: no genera ni aplica comentarios.

      parameters:
        - name: candidate_models
          default: ${var.candidate_models}
        - name: judge_model
          default: ${var.judge_model}
        - name: results_catalog
          default: ${var.results_catalog}
        - name: results_schema
          default: ${var.results_schema}
        - name: golden_table
          default: ${var.golden_table}
        - name: experiment_path
          default: ${var.experiment_path}
        - name: gen_temperature
          default: ${var.eval_gen_temperature}
        - name: n_consistency_runs
          default: ${var.eval_n_consistency_runs}
        - name: max_comment_chars
          default: ${var.eval_max_comment_chars}

      tasks:
        - task_key: eval_models
          description: "Ejecuta el bake-off y produce el scorecard"
          notebook_task:
            notebook_path: src/05_eval_models.py
            base_parameters:
              candidate_models:   "{{job.parameters.candidate_models}}"
              judge_model:        "{{job.parameters.judge_model}}"
              results_catalog:    "{{job.parameters.results_catalog}}"
              results_schema:     "{{job.parameters.results_schema}}"
              golden_table:       "{{job.parameters.golden_table}}"
              experiment_path:    "{{job.parameters.experiment_path}}"
              gen_temperature:    "{{job.parameters.gen_temperature}}"
              n_consistency_runs: "{{job.parameters.n_consistency_runs}}"
              max_comment_chars:  "{{job.parameters.max_comment_chars}}"
            source: WORKSPACE
          new_cluster: *single_node_cluster

      tags:
        project: "dbx-comments-gen"
        team: "field-engineering"

# ─────────────────────────────────────────────────────────────────────────────
# Targets
# ─────────────────────────────────────────────────────────────────────────────
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-361426925668745.5.azuredatabricks.net

  prod:
    mode: production
    workspace:
      host: https://adb-361426925668745.5.azuredatabricks.net
